<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doomscroll Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>📱 Doomscroll Calculator</h1>
    <p class="subtitle">hello.</p>

    <form id="calc-form" class="card">
      <label for="hours">Hours on your phone per day (social media / videos)</label>
      <input type="number" id="hours" min="0" max="24" step="0.5" placeholder="e.g. 4" required />

      <label for="age">Your current age</label>
      <input type="number" id="age" min="10" max="100" placeholder="e.g. 22" required />

      <button type="submit">Show me the truth</button>
    </form>

    <section id="results" class="hidden">
      <div class="card stats">
        <div class="stat">
          <span class="stat-number" id="per-year">0</span>
          <span class="stat-label">hours per year</span>
        </div>
        <div class="stat">
          <span class="stat-number" id="days-per-year">0</span>
          <span class="stat-label">full days per year</span>
        </div>
        <div class="stat">
          <span class="stat-number" id="lifetime-years">0</span>
          <span class="stat-label">years of your remaining life (to age 75)</span>
        </div>
      </div>

      <div class="card">
        <h2>In the next year, you could instead…</h2>
        <ul id="equivalents"></ul>
      </div>

      <div class="card">
        <h2>Try reducing it</h2>
        <label for="reduce">Cut your screen time by: <strong id="reduce-value">1</strong> hour/day</label>
        <input type="range" id="reduce" min="0" max="10" step="0.5" value="1" />
        <p id="reduce-result"></p>
      </div>

      <p class="note">These are rough estimates for fun and motivation, not exact science.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
